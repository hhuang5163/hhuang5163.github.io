---
layout: default
---
<div class="row">
    <div class="col-12 col-lg-10">
        <div class="bg-white shadow-sm rounded-sm p-4 p-md-5 mt-4">
            <h1 class="mb-1">{{ page.title }}</h1>
            <p class="text-muted small mb-4"><i>{{ page.date | date: "%B %-d, %Y" }}</i></p>
            {{ content }}
        </div>
        <p class="mt-3">
            <a href="{{ '/notes' | relative_url }}"><i class="fas fa-angle-double-left"></i> Back to Notes</a>
        </p>
    </div>
</div>
